[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petroleum-rto-agent"
version = "0.1.0"
description = "Offline petroleum RTO, CDU simulation, and local engineering assistant"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
domain-model = [
    "httpx==0.28.1",
]

[project.scripts]
cdu-mini = "petroleum_rto.cdu.runtime.cli:main"
rto-offline = "petroleum_rto.rto.runtime.cli:main"
rto-chat = "petroleum_rto.assistant.cli:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"petroleum_rto.cdu.runtime.data" = ["*.json"]
"petroleum_rto.rto.data" = ["*.json"]

[tool.setuptools.exclude-package-data]
"petroleum_rto.domain_model" = ["dmx_api.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-config --strict-markers"
