[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petroleum-rto-cdu-model"
version = "0.1.0"
description = "Reduced-order atmospheric crude distillation simulation and validation package"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
cdu-mini = "petroleum_rto.cdu.runtime.cli:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"petroleum_rto.cdu.runtime.data" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
